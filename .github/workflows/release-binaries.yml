name: Release Linux x86_64 Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build backend
        shell: bash
        env:
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: |
          cd backend
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package binary
        shell: bash
        run: |
          set -e
          ARTIFACT_NAME=BaiduPCS-Rust-${GITHUB_REF_NAME}-linux-x86_64
          PKG_DIR=release/$ARTIFACT_NAME
          mkdir -p "$PKG_DIR"

          cp backend/target/x86_64-unknown-linux-gnu/release/baidu-netdisk-rust "$PKG_DIR/"
          chmod +x "$PKG_DIR/baidu-netdisk-rust"

          cp -R frontend/dist "$PKG_DIR/frontend"
          cp config/app.toml.example "$PKG_DIR/config.toml.example"
          cp README.md "$PKG_DIR/README.md"

          tar czf "release/${ARTIFACT_NAME}.tar.gz" -C release "$ARTIFACT_NAME"
          echo "ARCHIVE_PATH=release/${ARTIFACT_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
